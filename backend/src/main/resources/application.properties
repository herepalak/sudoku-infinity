spring.application.name=sudoku-infinity

spring.datasource.url=jdbc:h2:mem:sudokuinfinity;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

app.jwt.secret=sudokuInfinitySecretKey2024VeryLongAndSecureRandomString123456789
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

app.cors.allowed-origins=http://localhost:5173

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

server.port=8080
logging.level.com.sudokuinfinity=INFO
logging.level.org.springframework.security=WARN